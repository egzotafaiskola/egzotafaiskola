<!DOCTYPE html>
<!--
  MÓDOSÍTÁS (2026-08-23, Fázis 1 / AUDIT #1)

  Ez a fájl KORÁBBAN a régi, használaton kívüli növénykatalógus volt. Két súlyos
  hibája volt: (1) nem szűrte a showonweb === false cikkeket, tehát nyilvánosan
  megmutatta mind a 93 elrejtett növényt, (2) az árakat szorzó nélkül, bruttó
  NAGYKERESKEDELMI áron írta ki mindenkinek.

  A fájlt NEM töröltük, mert 19 link mutat rá (menü + footer minden oldalon), és
  a js/vasarlo-modal.js csak akkor tudja elkapni ezeket a kattintásokat, ha a JS
  betöltődik. JS nélkül (vagy közvetlen URL-lel érkezve) a látogató 404-et kapna.

  Helyette ez a fájl most egy minimális, statikus vásárlóválasztó: ugyanaz a két
  út, mint a modalban, de sima <a> linkekkel, JavaScript nélkül is működik.
  Nincs benne katalóguslogika, GitHub API-hívás és árlista.

  A régi tartalom megmaradt: _backup_2026-08-23/products.html.regi
-->
<html lang="hu-HU">
<head>
  <meta charset="utf-8">
  <title>Növényeink — Egzóta Díszfaiskola</title>
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <!-- Ez az oldal szándékosan nincs indexelve: csak átvezető a két katalógusoldalra. -->
  <meta name="robots" content="noindex, nofollow">
  <link href="css/normalize.css" rel="stylesheet" type="text/css">
  <link href="css/webflow.css" rel="stylesheet" type="text/css">
  <link href="css/egzota-faiskola.webflow.css" rel="stylesheet" type="text/css">
  <link href="css/egzota-responsive.css" rel="stylesheet" type="text/css">
  <link href="images/favicon.ico" rel="shortcut icon" type="image/x-icon">
  <link href="images/webclip.png" rel="apple-touch-icon">
  <link href="images/favicon-192.png" rel="icon" type="image/png" sizes="192x192">
  <style>
    /* Sajat, "vk-" elotagu osztalyok, hogy semmilyen Webflow-osztallyal ne utkozzenek. */
    .vk-oldal{min-height:100vh;display:flex;align-items:center;justify-content:center;
              padding:2rem 1.25rem;background:#e9f7f2;box-sizing:border-box;}
    .vk-doboz{background:#fff;border-radius:16px;padding:2.5rem 2rem;max-width:520px;width:100%;
              text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.12);box-sizing:border-box;}
    .vk-logo{display:inline-block;margin-bottom:1.5rem;}
    .vk-logo img{display:block;height:64px;width:auto;background:#34d399;border-radius:10px;padding:6px 12px;}
    .vk-doboz h1{font-size:1.5rem;line-height:1.3;font-weight:700;color:#1a3d2b;margin:0 0 .5rem;}
    .vk-doboz p{font-size:.95rem;line-height:1.6;color:#3a6b4a;margin:0 0 1.75rem;}
    .vk-gombok{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;}
    .vk-gomb{flex:1 1 190px;display:block;padding:.9rem 1.25rem;border-radius:8px;
             font-size:1rem;font-weight:600;text-decoration:none;
             transition:transform .2s ease,box-shadow .2s ease;}
    .vk-gomb:hover,.vk-gomb:focus{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.15);}
    .vk-gomb:focus-visible{outline:3px solid #064e3b;outline-offset:2px;}
    .vk-gomb-elsodleges{background:#2d7a4f;color:#fff;}
    .vk-gomb-masodlagos{background:#fff;color:#1f5c3a;border:2px solid #2d7a4f;}
    .vk-vissza{display:inline-block;margin-top:1.5rem;font-size:.9rem;color:#3a6b4a;}
    @media (max-width:479px){
      .vk-doboz{padding:2rem 1.25rem;}
      .vk-doboz h1{font-size:1.3rem;}
      .vk-gomb{flex:1 1 100%;}
    }
  </style>
</head>
<body>
  <main class="vk-oldal">
    <div class="vk-doboz">
      <a href="index.html" class="vk-logo">
        <img src="images/egzota-logo.png" width="165" height="110" alt="Egzóta Díszfaiskola – vissza a főoldalra">
      </a>
      <h1>Hogyan szeretne vásárolni?</h1>
      <p>Kérjük, válassza ki, hogy magánszemélyként vagy cégként szeretné megtekinteni a növénykínálatunkat. Az árak ennek megfelelően jelennek meg.</p>
      <div class="vk-gombok">
        <a href="products-maganszemelyeknek.html" class="vk-gomb vk-gomb-elsodleges">Magánszemélyként</a>
        <a href="products-cegeknek.html" class="vk-gomb vk-gomb-masodlagos">Cégként</a>
      </div>
      <a href="index.html" class="vk-vissza">Vissza a főoldalra</a>
    </div>
  </main>
</body>
</html>
